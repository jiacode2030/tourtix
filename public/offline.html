<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>You're offline · TourTix</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#5b5b66; --surface:#f5f5f6; --cta:#d23d12; --on-cta:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e0e11; --fg:#f4f4f6; --muted:#a1a1ad; --surface:#1a1a1f; --cta:#ff7a4d; --on-cta:#160b06; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:420px; text-align:center; }
  .logo { font-size:22px; font-weight:800; letter-spacing:-0.02em; margin-bottom:28px; }
  .logo span { color:var(--cta); }
  h1 { font-size:30px; line-height:1.15; letter-spacing:-0.02em; margin:0 0 12px; }
  p { color:var(--muted); font-size:16px; line-height:1.5; margin:0 0 24px; }
  button { font:inherit; font-weight:600; min-height:48px; padding:0 28px; border:0; border-radius:999px;
    background:var(--cta); color:var(--on-cta); cursor:pointer; }
  .note { margin-top:28px; padding:14px 16px; border-radius:16px; background:var(--surface); font-size:14px; }
</style>
</head>
<body>
<main>
  <div class="logo">Tour<span>Tix</span></div>
  <h1>You're offline</h1>
  <p>TourTix needs an internet connection to show current ticket times. Check your connection, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <p class="note">We don't save show pages on your device, so you never see an out-of-date sale time.</p>
</main>
</body>
</html>
